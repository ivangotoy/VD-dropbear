# Builds the module from main merged with upstream, releases it on this forge and
# points the module's updateJson at this repo. Logic: .forgejo/module-ci.sh,
# per-repo settings: .forgejo/module-ci.conf.
name: module-release

on:
  workflow_dispatch:

# one release run at a time: a second dispatch queues behind a running one instead of releasing the
# same versionCode next to it (Forgejo honours this best-effort; module-ci.sh also reads the last
# release from main's tip and from the forge's release list)
concurrency:
  group: module-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: kernelsu-ci
    timeout-minutes: 170
    steps:
      # the dispatched commit, also when main has moved since: the root half of the build and
      # the release step then use the same module-ci.sh and conf
      - name: Checkout (the dispatched commit)
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          # the clone runs before module-ci.sh sets these: a stalled transfer fails instead of hanging
          GIT_HTTP_LOW_SPEED_LIMIT: 1024
          GIT_HTTP_LOW_SPEED_TIME: 60
        run: |
          set -eu
          git clone -q --branch main "$SERVER_URL/$REPOSITORY.git" src
          git -C src checkout -q --detach "$BASE_SHA"
      - name: Build (no forge token, unprivileged build user)
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -eu
          bash src/.forgejo/module-ci.sh build src
      - name: Release (script and config from the dispatched commit)
        env:
          RELEASE_TOKEN: ${{ secrets.MODULE_RELEASE_TOKEN }}
          # PEM private key that signs the VDLU feed (this step only; module-ci.sh moves it to a 0600 file)
          VDLU_SIGN_KEY: ${{ secrets.VDLU_SIGN_KEY }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          curl -fsS --connect-timeout 30 --max-time 120 -o module-ci.sh "$SERVER_URL/$REPOSITORY/raw/commit/$BASE_SHA/.forgejo/module-ci.sh"
          bash module-ci.sh release src
