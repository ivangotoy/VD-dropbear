UPSTREAM_URL=https://github.com/VD171/VD-dropbear.git
UPSTREAM_BRANCH=master
ZIP_PREFIX=VD-dropbear
VERSION_CODE_FLOOR=10019
VERSION_CODE_OFFSET=6
CHANGELOG_PATH=CHANGELOG.md
# upstream .github/workflows/release.yml: the SSH binaries are committed (module/bin, checked
# against module/bin/PROVENANCE.json), the zip is module/ plus the notice files and a .sha256
# companion per file.
# VDLU flashless updater (vdlu/, webroot/vdlu.*): shipped, fed only from this forge. build() makes the
# keyring hold only the owner key (.forgejo/vdlu/), points config.default at this repo's feed
# (written by the release step, module-ci.sh) and ships the static curl the engine fetches with.
VDLU_FEED_PATH=.forgejo/vdlu-feed
VDLU_KEY_ID=ivangotoy-2026
build() {
    : "${SERVER_URL:?}" "${REPOSITORY:?}"
    python3 -I - <<'PY' >&2
import hashlib, json, sys
d = json.load(open("module/bin/PROVENANCE.json"))
bad = [f"module/bin/{a}/{b}" for b, m in d["binaries"].items() for a, i in m["abi"].items()
       if hashlib.sha256(open(f"module/bin/{a}/{b}", "rb").read()).hexdigest() != i["sha256"]]
sys.exit("provenance MISMATCH: " + ", ".join(bad)) if bad else print("provenance OK")
PY
    # keyring: the owner's key only (upstream's key and its baseline.json, signed for upstream's
    # feed, stay out; the release step adds the baseline signed for this release)
    [ "$(wc -c < ".forgejo/vdlu/$VDLU_KEY_ID.pub")" -eq 32 ] || { echo "$VDLU_KEY_ID.pub is not a raw 32-byte key" >&2; return 1; }
    rm -f module/vdlu/keyring/* module/vdlu/baseline.json
    cp ".forgejo/vdlu/$VDLU_KEY_ID.pub" module/vdlu/keyring/
    chmod 0644 "module/vdlu/keyring/$VDLU_KEY_ID.pub"
    python3 -I - module/vdlu/config.default "$SERVER_URL/$REPOSITORY/raw/branch/main/$VDLU_FEED_PATH" "$VDLU_KEY_ID" <<'PY' >&2
import re, sys
p, src, kid = sys.argv[1:]
s = open(p).read()
if len(re.findall(r"(?m)^source=.*$", s)) != 1:
    sys.exit("vdlu/config.default: no single source= line: update module-ci.conf")
s = re.sub(r"(?m)^source=.*$", lambda m: "source=" + src, s)
s = re.sub(r"(?m)^key_id=.*\n", "", s)
s = s.rstrip("\n") + "\nkey_id=" + kid + "\n"
if re.search(r"(?mi)^(tools_source|pubkey_dir)=(?!keyring$)", s):
    sys.exit("vdlu/config.default sets tools_source or another pubkey_dir: update module-ci.conf")
open(p, "w").write(s); print("vdlu/config.default: source=" + src + ", key_id=" + kid)
PY
    # the engine fetches with curl, found in bin/<abi> (update.sh bundled_bins_on_path); the WebUI's
    # one-time curl download (vdlu.js) is skipped when bin/<abi>/curl exists
    python3 -I - <<'PY' >&2
import hashlib, json, shutil, sys
d = json.load(open(".forgejo/vdlu/PROVENANCE.json"))["files"]
for k, v in d.items():
    if not k.startswith("curl/"):
        continue
    abi = k.split("/")[1]
    if hashlib.sha256(open(".forgejo/vdlu/" + k, "rb").read()).hexdigest() != v["sha256"]:
        sys.exit(f".forgejo/vdlu/{k}: sha256 differs from PROVENANCE.json")
    shutil.copyfile(".forgejo/vdlu/" + k, f"module/bin/{abi}/curl")
print("curl copied to module/bin/<abi>/curl")
PY
    chmod 0755 module/bin/*/curl
    # existing installs: the feed, key and profile of this zip replace another build's on every flash
    grep -q '^# fork: VDLU feed and key on every flash' module/customize.sh \
        || cat .forgejo/vdlu/customize-fork.sh >> module/customize.sh
    sh -n module/customize.sh
    cp .forgejo/vdlu/curl/NOTICE module/licenses/curl-NOTICE
    chmod 0644 module/licenses/curl-NOTICE
    cp LICENSE NOTICE THIRD-PARTY-NOTICES.md module/
    chmod 0644 module/LICENSE module/NOTICE module/THIRD-PARTY-NOTICES.md
    # Like upstream's release.yml, every shipped file gets a <file>.sha256 companion, which
    # customize.sh (.vd/sha256-gate.sh) checks at flash time; it aborts the flash on a mismatch
    # and on a companion whose file is missing. So the final tree is hashed.
    find module -name .gitkeep -delete
    sh .github/scripts/gen-sha256.sh module >&2
    # The same tree gives the same zip bytes: every entry gets one fixed mtime (zip stores local
    # time, so TZ is pinned for touch and zip) and the entries go in sorted, not in directory order.
    TZ=UTC0 find module -exec touch -t 202601010000.00 {} +
    (cd module && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort | TZ=UTC0 zip -q9 -X -@ "$OUT/module.zip")
}
