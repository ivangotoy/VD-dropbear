UPSTREAM_URL=https://github.com/VD171/VD-dropbear.git
UPSTREAM_BRANCH=master
ZIP_PREFIX=VD-dropbear
VERSION_CODE_FLOOR=10010
VERSION_CODE_OFFSET=1
CHANGELOG_PATH=CHANGELOG.md
# upstream .github/workflows/build.yml: the SSH binaries are committed (module/bin, checked
# against module/bin/PROVENANCE.json), the zip is module/ plus the notice files.
# Fork change: the VDLU flashless updater (vdlu/, webroot/vdlu.*) is left out of the zip and
# its install lines are removed from customize.sh, so updateJson on this forge is the only
# update path (VDLU pulls signed files from the upstream author's feed, module.prop included).
build() {
    python3 -I - <<'PY' >&2
import hashlib, json, sys
d = json.load(open("module/bin/PROVENANCE.json"))
bad = [f"module/bin/{a}/{b}" for b, m in d["binaries"].items() for a, i in m["abi"].items()
       if hashlib.sha256(open(f"module/bin/{a}/{b}", "rb").read()).hexdigest() != i["sha256"]]
sys.exit("provenance MISMATCH: " + ", ".join(bad)) if bad else print("provenance OK")
PY
    python3 -I - module/customize.sh <<'PY' >&2
import re, sys
p = sys.argv[1]; s = open(p).read()
n1 = len(re.findall(r'(?m)^.*\$MODPATH/vdlu/.*-exec chmod.*\n|^set_perm "\$MODPATH/vdlu/[^\n]*\n', s))
s = re.sub(r'(?m)^set_perm "\$MODPATH/vdlu/[^\n]*\n|^\[ -d "\$MODPATH/vdlu/verify" \][^\n]*\n', '', s)
s, n2 = re.subn(r'(?ms)^# VDLU flashless updater:.*?^fi\n\n?', '', s)
if n1 != 3 or n2 != 1 or "vdlu" in s.lower():
    sys.exit(f"customize.sh VDLU lines changed upstream ({n1}/3, {n2}/1): update module-ci.conf")
open(p, "w").write(s); print("customize.sh: VDLU install lines removed")
PY
    sh -n module/customize.sh
    cp LICENSE NOTICE THIRD-PARTY-NOTICES.md module/
    chmod 0644 module/LICENSE module/NOTICE module/THIRD-PARTY-NOTICES.md
    (cd module && zip -qr9 -X "$OUT/module.zip" . -x '*/.gitkeep' -x 'vdlu/*' -x 'webroot/vdlu.js' -x 'webroot/vdlu.css')
}
